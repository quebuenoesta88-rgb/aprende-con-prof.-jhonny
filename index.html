    materiaActiva = materiaId;

        subTabsContainer.style.display = "flex";

        return;
    }
    const pregunta = preguntasActuales[indiceActual];
    preguntaTextoDiv.innerText = `${indiceActual+1}. ${pregunta.texto}`;
    opcionesContainer.innerHTML = '';
    pregunta.opciones.forEach((opc, idx) => {
        const btnOpcion = document.createElement('div');
        btnOpcion.classList.add('opcion');
        btnOpcion.innerText = `${String.fromCharCode(65+idx)}. ${opc}`;
        btnOpcion.dataset.idx = idx;
        btnOpcion.addEventListener('click', () => responderPregunta(idx));
        opcionesContainer.appendChild(btnOpcion);
    });
}

function responderPregunta(seleccionIdx) {
    if (juegoTerminado) return;
    const pregunta = preguntasActuales[indiceActual];
    const esCorrecta = (seleccionIdx === pregunta.correcta);
    if (esCorrecta) {
        puntaje++;
        const mensajeFlash = document.createElement('div');
        mensajeFlash.innerText = "✅ ¡Correcto! ¡Sigue así!";
        mensajeFlash.style.position = "fixed"; mensajeFlash.style.bottom = "20px"; mensajeFlash.style.left="20px";
        mensajeFlash.style.backgroundColor="#2e7d32"; mensajeFlash.style.color="white"; mensajeFlash.style.padding="8px 16px"; mensajeFlash.style.borderRadius="30px";
        document.body.appendChild(mensajeFlash);
        setTimeout(() => mensajeFlash.remove(), 700);
    } else {
        const mensajeFlash = document.createElement('div');
        mensajeFlash.innerText = `❌ Incorrecto. La respuesta era: ${pregunta.opciones[pregunta.correcta]}`;
        mensajeFlash.style.position = "fixed"; mensajeFlash.style.bottom = "20px"; mensajeFlash.style.left="20px";
        mensajeFlash.style.backgroundColor="#c62828"; mensajeFlash.style.color="white"; mensajeFlash.style.padding="8px 16px"; mensajeFlash.style.borderRadius="30px";
        document.body.appendChild(mensajeFlash);
        setTimeout(() => mensajeFlash.remove(), 1200);
    }
    indiceActual++;
    actualizarPuntaje();
    actualizarPregunta();
}

function actualizarPuntaje() {
    if(preguntasActuales.length > 0) {
        puntajeDisplay.innerText = `Puntaje: ${puntaje} / ${preguntasActuales.length}`;
    } else {
        puntajeDisplay.innerText = `Puntaje: 0 / 0`;
    }
}

function reiniciarJuego() {
    if (materiaActiva === "cultura_mundial") {
        cargarSubCategoria(subCategoriaActiva);
    } else {
        cargarMateria(materiaActiva);
    }
}

document.querySelectorAll('.btn-tab').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const materia = btn.getAttribute('data-materia');
        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        cargarMateria(materia);
    });
});

document.querySelectorAll('.btn-subtab').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const sub = btn.getAttribute('data-sub');
        document.querySelectorAll('.btn-subtab').forEach(b => b.classList.remove('activo-sub'));
        btn.classList.add('activo-sub');
        if (materiaActiva === "cultura_mundial") {
            cargarSubCategoria(sub);
        } else {
            subCategoriaActiva = sub;
        }
    });
});

reiniciarBtn.addEventListener('click', reiniciarJuego);
actualizarTextosBotones();
cargarMateria('matematica');
</script>
</body>
</html>
